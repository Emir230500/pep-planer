name: PEP Planer wach halten

on:
  schedule:
    - cron: "*/10 * * * *"
    - cron: "0,15,30,45 6,7 * * *"
    - cron: "0,15 8 * * *"
  workflow_dispatch:

jobs:
  keep-awake:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: App aufwecken
        run: |
          curl --fail --silent --show-error \
            --retry 5 --retry-delay 10 --max-time 90 \
            https://pep-planer.onrender.com/health

      - name: Umsatzmails zu den Morgen-Zeitpunkten pruefen
        if: github.event_name == 'schedule'
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$CRON_SECRET" || { echo "CRON_SECRET fehlt"; exit 1; }
          curl --fail --silent --show-error \
            --retry 3 --retry-delay 10 --max-time 90 \
            -H "x-cron-secret: $CRON_SECRET" -X POST https://pep-planer.onrender.com/api/jobs/revenue-import
