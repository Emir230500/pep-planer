<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Arbeitsplan</title>
  <link rel="stylesheet" href="/styles.css?v=20260817-push-reparatur">
</head>
<body>
  <main class="shell">
    <section class="top">
      <div>
        <p class="eyebrow">Arbeitsplan - Elli SHS</p>
      </div>
      <a id="adminLink" class="link hidden" href="/admin.html">Verwalten</a>
    </section>

    <section id="login" class="panel">
      <h2>Mitarbeiter-Login</h2>
      <form id="employeeLoginForm" autocomplete="on">
        <label>Name<input id="name" name="username" autocomplete="username" placeholder="z. B. Demircan, Emirkan"></label>
        <label>PIN<input id="pin" name="password" type="password" inputmode="numeric" autocomplete="current-password" placeholder="4-stellige PIN"></label>
        <button id="loginBtn" type="submit">Anmelden</button>
        <p id="loginMsg" class="msg"></p>
      </form>
    </section>

    <section id="plans" class="hidden">
      <div class="bar">
        <h2 id="hello"></h2>
      </div>
      <div id="pushBox" class="push-box hidden">
        <button id="pushBtn" class="secondary" type="button">Push aktivieren</button>
        <p id="pushMsg" class="msg"></p>
      </div>
      <div id="shiftList"></div>
      <div class="logout-area">
        <button id="logoutBtn" class="secondary">Abmelden</button>
      </div>
    </section>

    <footer class="site-credit">Created by Demircan</footer>
  </main>
  <script src="/app.js?v=20260817-push-reparatur"></script>
</body>
</html>
