<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Backshop Produktion</title>
<link rel="stylesheet" href="/styles.css?v=20260918-prod1">
<style>
body{background:#f5f5f7}.prod-shell{width:min(980px,100%);margin:0 auto;padding:18px}.prod-top{display:flex;justify-content:space-between;gap:14px;align-items:center;margin-bottom:16px}.prod-top h1{font-size:30px}.prod-sub{color:var(--muted);margin:5px 0 0}.prod-home{white-space:nowrap}.prod-card{background:#fff;border:1px solid #e2e2e7;border-radius:22px;box-shadow:0 8px 28px rgba(0,0,0,.055);padding:18px;margin-bottom:14px}.prod-hero{padding:22px;background:linear-gradient(145deg,#fff,#f7faff)}.prod-date-row{display:flex;gap:12px;align-items:end;justify-content:space-between}.prod-date-row label{margin:0;max-width:240px}.prod-context{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.chip{background:#f0f2f5;border-radius:999px;padding:7px 11px;font-size:13px;font-weight:700}.chip.good{background:#eaf8ef;color:#176b35}.chip.warn{background:#fff4dd;color:#8d5700}.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:#ececf1;border-radius:15px;padding:4px;margin-bottom:14px}.seg button{border:0;background:transparent;color:#4d4d53;border-radius:12px;min-height:46px;box-shadow:none;padding:9px}.seg button.active{background:#fff;color:#111;box-shadow:0 1px 6px rgba(0,0,0,.14)}.prod-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.sum{background:#f7f7f9;border-radius:16px;padding:14px}.sum span,.sum strong{display:block}.sum span{color:var(--muted);font-size:12px}.sum strong{font-size:25px;margin-top:3px}.program{padding:0;overflow:hidden}.program-head{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:16px 18px;border-bottom:1px solid #ededf1}.program-head h2{margin:0;font-size:18px}.program-head span{color:var(--muted);font-size:13px}.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:15px 18px;border-top:1px solid #f0f0f2}.item:first-of-type{border-top:0}.item-name{font-weight:800;line-height:1.25}.item-meta{font-size:12px;color:var(--muted);margin-top:4px}.qtybox{display:flex;align-items:center;gap:8px}.done-btn{width:auto;min-width:104px;min-height:46px;border-radius:14px}.done-btn.done{background:#e9f8ee;color:#176b35;border-color:#9ad3aa}.actual-input{width:76px!important;min-height:44px!important;text-align:center;font-size:18px!important;font-weight:800!important;margin:0!important}.history{display:flex;gap:8px;overflow:auto;padding-bottom:3px}.history button{width:auto;white-space:nowrap;min-height:40px;padding:8px 12px;border-radius:12px}.history button.active{background:#111;color:#fff}.empty{text-align:center;color:var(--muted);padding:28px}.error{color:#b42318}.loading{opacity:.6;pointer-events:none}.interval-title{display:flex;justify-content:space-between;align-items:end;gap:12px;margin:6px 0 12px}.interval-title h2{font-size:22px;margin:0}.interval-title span{color:var(--muted);font-size:13px}.tiny{font-size:12px;color:var(--muted)}
@media(max-width:700px){.prod-shell{padding:12px}.prod-top{align-items:flex-start}.prod-top h1{font-size:25px}.prod-home{font-size:14px}.prod-date-row{align-items:stretch;flex-direction:column}.prod-date-row label{max-width:none}.prod-summary{grid-template-columns:1fr 1fr}.sum strong{font-size:22px}.prod-card{border-radius:18px;padding:15px}.program{padding:0}.program-head,.item{padding:14px}.item{grid-template-columns:1fr}.qtybox{justify-content:space-between}.done-btn{min-width:112px}.seg button{font-size:14px;padding:7px 4px}.interval-title{align-items:flex-start;flex-direction:column;gap:2px}}
</style>
</head>
<body>
<main class="prod-shell">
<div class="prod-top"><div><p class="eyebrow">Elli Schloß Holte · Produktion</p><h1>Heute backen</h1><p class="prod-sub" id="statusText">Plan wird geladen …</p></div><a class="link prod-home" href="/">Arbeitsplan</a></div>
<section class="prod-card prod-hero"><div class="prod-date-row"><div><strong id="dateHeadline">–</strong><div class="tiny" id="generatedText"></div></div><label>Plan wählen<input id="datePicker" type="date"></label></div><div class="prod-context" id="contextChips"></div></section>
<section class="prod-card"><div class="prod-summary"><div class="sum"><span>Gesamt</span><strong id="sumAll">–</strong></div><div class="sum"><span>Backplan</span><strong id="sumBack">–</strong></div><div class="sum"><span>Brotplan</span><strong id="sumBrot">–</strong></div><div class="sum"><span>Auftauplan</span><strong id="sumAuftau">–</strong></div></div></section>
<div class="seg" id="typeTabs"><button data-type="Backplan" class="active">Backplan</button><button data-type="Brotplan">Brotplan</button><button data-type="Auftauplan">Auftauplan</button></div>
<div class="seg" id="intervalTabs"><button data-i="0" class="active">Morgen</button><button data-i="1">Mittag</button><button data-i="2">Nachmittag</button></div>
<div class="interval-title"><h2 id="intervalHeadline">Morgen</h2><span id="intervalTime">–</span></div><div id="programs"><div class="prod-card empty">Plan wird geladen …</div></div>
<section class="prod-card"><h2>Alte Pläne</h2><p class="tiny">Zum Nachschauen – der neueste Plan bleibt immer zuerst.</p><div class="history" id="history"></div></section>
</main>
<script>
"use strict";const $=s=>document.querySelector(s);let current=null,currentType="Backplan",currentInterval=0,history=[];function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}function deDate(d){return d?new Intl.DateTimeFormat("de-DE",{weekday:"long",day:"2-digit",month:"2-digit",year:"numeric"}).format(new Date(d+"T12:00:00")):""}async function api(u,o){let r=await fetch(u,o),j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||"Daten konnten nicht geladen werden.");return j}function renderHistory(){$("#history").innerHTML=history.map(p=>`<button class="secondary ${current?.plan_date===p.plan_date?'active':''}" data-date="${p.plan_date}">${deDate(p.plan_date).replace(/,? \d{4}$/,'')}</button>`).join("")||'<span class="tiny">Noch keine älteren Pläne.</span>';document.querySelectorAll("#history button").forEach(b=>b.onclick=()=>loadPlan(b.dataset.date))}function chipHtml(p){let c=p.context||{},w=p.weather||{},a=[];if(c.isHoliday)a.push(`<span class="chip warn">Feiertag · ${esc(c.holiday)}</span>`);else if(c.dayBeforeHoliday)a.push('<span class="chip warn">Tag vor Feiertag</span>');else a.push('<span class="chip good">Kein Feiertag</span>');a.push(!w.unavailable&&w.max!=null?`<span class="chip">Wetter ${Math.round(w.max)}° · ${Number(w.rain||0).toFixed(0)} mm Regen</span>`:'<span class="chip">Wetter nicht verfügbar</span>');if(p.source_max_date)a.push(`<span class="chip">Daten bis ${new Intl.DateTimeFormat('de-DE').format(new Date(p.source_max_date+'T12:00:00'))}</span>`);return a.join('')}function actuals(){return new Map((current?.actuals||[]).map(a=>[`${a.article_no}|${a.interval_index}`,a]))}function render(){if(!current)return;let p=current.payload,I=p.intervals||[],$d=$("#dateHeadline");$d.textContent=deDate(current.plan_date);$("#datePicker").value=current.plan_date;$("#generatedText").textContent=`Erstellt ${new Intl.DateTimeFormat('de-DE',{dateStyle:'short',timeStyle:'short'}).format(new Date(current.generated_at))}`;$("#contextChips").innerHTML=chipHtml(current);$("#sumAll").textContent=p.totals?.all??0;$("#sumBack").textContent=p.totals?.Backplan??0;$("#sumBrot").textContent=p.totals?.Brotplan??0;$("#sumAuftau").textContent=p.totals?.Auftauplan??0;let it=I[currentInterval]||{name:['Morgen','Mittag','Nachmittag'][currentInterval],from:'',to:''};$("#intervalHeadline").textContent=it.name;$("#intervalTime").textContent=it.from&&it.to?`${it.from}–${it.to} Uhr`:'';document.querySelectorAll('#typeTabs button').forEach(b=>b.classList.toggle('active',b.dataset.type===currentType));document.querySelectorAll('#intervalTabs button').forEach((b,i)=>{b.classList.toggle('active',i===currentInterval);if(I[i])b.textContent=I[i].name});let rows=(p.items||[]).filter(x=>x.type===currentType&&(x.buckets?.[currentInterval]||0)>0),groups=new Map;for(let x of rows){if(!groups.has(x.program))groups.set(x.program,[]);groups.get(x.program).push(x)}let am=actuals(),html='';for(let [program,items] of [...groups].sort((a,b)=>String(a[0]).localeCompare(String(b[0]),'de',{numeric:true}))){let total=items.reduce((s,x)=>s+(x.buckets[currentInterval]||0),0);html+=`<section class="prod-card program"><div class="program-head"><div><h2>${currentType==='Auftauplan'?'Auftauen':'Programm '+esc(program)}</h2><span>${items.length} Artikel</span></div><strong>${total} Stk.</strong></div>`;for(let x of items){let planned=x.buckets[currentInterval]||0,key=`${x.no}|${currentInterval}`,act=am.get(key),done=!!act,value=done?act.actual_qty:planned;html+=`<div class="item"><div><div class="item-name">${esc(x.name)}</div><div class="item-meta">Tagesplan ${x.total} · ${x.risk==='hoch'?'Abschrift beachten':x.history+' Vergleichstage'}</div></div><div class="qtybox"><input class="actual-input" inputmode="numeric" min="0" step="1" value="${value}" data-input="${esc(x.no)}"><span class="tiny">Stk.</span><button class="done-btn ${done?'done':''}" data-done="${esc(x.no)}" data-planned="${planned}">${done?'✓ Gebacken':'Gebacken'}</button></div></div>`}html+='</section>'}$("#programs").innerHTML=html||'<div class="prod-card empty">Für dieses Intervall ist nichts geplant.</div>';document.querySelectorAll('[data-done]').forEach(btn=>btn.onclick=()=>saveDone(btn));$("#statusText").textContent=`Automatischer Produktionsplan · ${(p.items||[]).filter(x=>x.type===currentType).length} Artikel`;renderHistory()}async function saveDone(btn){let no=btn.dataset.done,input=document.querySelector(`[data-input="${CSS.escape(no)}"]`),actual=Math.max(0,Math.round(Number(input?.value||0))),planned=Number(btn.dataset.planned||0);btn.disabled=true;try{await api('/api/bakery/actual',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({date:current.plan_date,articleNo:no,intervalIndex:currentInterval,plannedQty:planned,actualQty:actual})});current=(await api(`/api/bakery/plan?date=${encodeURIComponent(current.plan_date)}`)).plan;render()}catch(e){alert(e.message)}finally{btn.disabled=false}}async function loadPlan(d){document.body.classList.add('loading');try{current=(await api(`/api/bakery/plan?date=${encodeURIComponent(d)}`)).plan;render()}catch(e){$("#programs").innerHTML=`<div class="prod-card empty error">${esc(e.message)}</div>`}finally{document.body.classList.remove('loading')}}async function boot(){try{history=(await api('/api/bakery/plans')).plans||[];if(!history.length){$("#statusText").textContent='Noch kein automatischer Plan vorhanden.';$("#programs").innerHTML='<div class="prod-card empty">Der erste Plan wird nach der Abendmail automatisch erstellt.</div>';return}let today=new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Berlin',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date()),best=history.find(p=>p.plan_date===today)||history.find(p=>p.plan_date>today)||history[0];await loadPlan(best.plan_date)}catch(e){$("#statusText").textContent=e.message;$("#programs").innerHTML=`<div class="prod-card empty error">${esc(e.message)}</div>`}}document.querySelectorAll('#typeTabs button').forEach(b=>b.onclick=()=>{currentType=b.dataset.type;render()});document.querySelectorAll('#intervalTabs button').forEach(b=>b.onclick=()=>{currentInterval=Number(b.dataset.i);render()});$("#datePicker").onchange=e=>loadPlan(e.target.value);boot();
</script>
</body></html>
