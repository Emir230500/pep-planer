<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f5f7">
<title>Produktion · Elli SHS</title>
<link rel="stylesheet" href="/styles.css?v=20260918-prod2">
<style>
:root{--prod-bg:#f5f5f7;--prod-card:#fff;--prod-line:#e7e7ec;--prod-text:#111114;--prod-muted:#6e6e73;--prod-green:#1f8a4c;--prod-green-bg:#eaf7ef;--prod-blue:#0a66ff;--prod-warn:#9a6100;--prod-warn-bg:#fff4dc}
*{box-sizing:border-box}body{background:var(--prod-bg);color:var(--prod-text);-webkit-font-smoothing:antialiased}.prod-shell{width:min(920px,100%);margin:0 auto;padding:18px 18px calc(34px + env(safe-area-inset-bottom))}.prod-top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin:2px 0 18px}.prod-top h1{font-size:32px;line-height:1.05;letter-spacing:-.025em;margin:3px 0 7px}.prod-kicker{font-size:13px;font-weight:800;letter-spacing:.04em;color:#6e6e73;text-transform:uppercase;margin:0}.prod-sub{color:var(--prod-muted);margin:0;font-size:14px}.prod-nav{display:flex;gap:8px;align-items:center}.prod-nav a{white-space:nowrap}.prod-card{background:var(--prod-card);border:1px solid var(--prod-line);border-radius:22px;box-shadow:0 8px 30px rgba(0,0,0,.045);padding:18px;margin-bottom:14px}.hero{padding:20px}.hero-row{display:flex;justify-content:space-between;gap:14px;align-items:center}.hero-date{font-size:20px;font-weight:850;letter-spacing:-.015em}.hero-meta{font-size:12px;color:var(--prod-muted);margin-top:4px}.today-btn{width:auto!important;min-height:42px!important;padding:9px 14px!important;border-radius:13px!important}.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.chip{display:inline-flex;align-items:center;gap:6px;background:#f0f1f4;border-radius:999px;padding:7px 11px;font-size:12px;font-weight:800;color:#4b4b50}.chip.good{background:var(--prod-green-bg);color:#176a38}.chip.warn{background:var(--prod-warn-bg);color:var(--prod-warn)}.chip.preview{background:#f2ecff;color:#6741a5}.overview{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center}.overview strong{font-size:28px;letter-spacing:-.02em}.overview small{display:block;color:var(--prod-muted);margin-top:3px}.progress-wrap{min-width:145px}.progress-head{display:flex;justify-content:space-between;gap:10px;font-size:12px;font-weight:800;color:var(--prod-muted);margin-bottom:7px}.progress{height:8px;border-radius:999px;background:#ececf0;overflow:hidden}.progress>span{display:block;height:100%;background:var(--prod-green);border-radius:inherit;transition:width .2s ease}.sticky-controls{position:sticky;top:0;z-index:6;background:rgba(245,245,247,.91);backdrop-filter:saturate(180%) blur(18px);-webkit-backdrop-filter:saturate(180%) blur(18px);padding:8px 0 6px;margin:0 0 8px}.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:#e9e9ee;border-radius:16px;padding:4px;margin-bottom:8px}.seg button{border:0;background:transparent;color:#55555b;border-radius:13px;min-height:46px;box-shadow:none;padding:8px 6px;font-weight:800}.seg button.active{background:#fff;color:#111;box-shadow:0 1px 8px rgba(0,0,0,.12)}.interval-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-end;margin:13px 2px 10px}.interval-head h2{font-size:23px;letter-spacing:-.02em;margin:0}.interval-time{font-size:13px;color:var(--prod-muted);font-weight:700}.program{padding:0;overflow:hidden}.program-head{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:15px 17px;background:#fbfbfc;border-bottom:1px solid #ededf1}.program-title{font-size:18px;font-weight:850}.program-head small{display:block;color:var(--prod-muted);margin-top:2px}.program-total{font-weight:850;font-size:16px}.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center;padding:16px 17px;border-top:1px solid #f0f0f2;transition:background .15s ease,opacity .15s ease}.item:first-of-type{border-top:0}.item.done{background:#fbfdfb}.item.done .item-name{color:#606064}.item-name{font-weight:850;line-height:1.24;font-size:16px}.item-meta{display:flex;flex-wrap:wrap;gap:7px;align-items:center;font-size:12px;color:var(--prod-muted);margin-top:5px}.planned-pill{display:inline-flex;align-items:center;background:#f1f2f4;border-radius:9px;padding:3px 7px;font-weight:800;color:#414146}.done-time{color:#35724b}.action{display:flex;align-items:center;gap:8px}.stepper{display:flex;align-items:center;background:#f1f2f4;border-radius:13px;padding:3px}.stepper button{width:38px!important;height:38px!important;min-height:38px!important;padding:0!important;border:0!important;border-radius:10px!important;background:transparent!important;color:#333!important;box-shadow:none!important;font-size:21px!important}.actual-input{width:58px!important;min-height:38px!important;padding:0 4px!important;border:0!important;background:transparent!important;text-align:center;font-size:18px!important;font-weight:850!important;margin:0!important;box-shadow:none!important}.done-btn{width:auto!important;min-width:112px;min-height:46px!important;border-radius:14px!important;padding:10px 14px!important;font-weight:850!important}.done-btn.done{background:var(--prod-green-bg)!important;color:#176a38!important;border-color:#a9d7b8!important}.readonly .stepper button,.readonly .actual-input,.readonly .done-btn{pointer-events:none}.readonly .stepper{opacity:.72}.history-box summary{cursor:pointer;font-weight:850;list-style:none;display:flex;align-items:center;justify-content:space-between;gap:12px}.history-box summary::-webkit-details-marker{display:none}.history-box summary::after{content:'›';font-size:24px;transform:rotate(90deg);transition:transform .16s ease}.history-box[open] summary::after{transform:rotate(-90deg)}.history{display:flex;gap:8px;overflow:auto;padding:14px 1px 2px}.history button{width:auto!important;white-space:nowrap;min-height:40px!important;padding:8px 12px!important;border-radius:12px!important}.history button.active{background:#111!important;color:#fff!important}.empty{text-align:center;color:var(--prod-muted);padding:30px}.error{color:#b42318}.loading{opacity:.55;pointer-events:none}.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translate(-50%,18px);background:#111;color:#fff;border-radius:14px;padding:11px 15px;font-size:13px;font-weight:800;opacity:0;pointer-events:none;z-index:30;transition:.18s ease;box-shadow:0 10px 30px rgba(0,0,0,.18)}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:700px){.prod-shell{padding:12px 12px calc(28px + env(safe-area-inset-bottom))}.prod-top{align-items:flex-start}.prod-top h1{font-size:27px}.prod-nav{gap:5px}.prod-nav a{font-size:13px;padding:7px 9px}.prod-card{border-radius:19px;padding:15px}.hero{padding:17px}.overview{grid-template-columns:1fr}.progress-wrap{min-width:0}.sticky-controls{margin-left:-2px;margin-right:-2px}.seg button{font-size:14px;padding:7px 3px}.interval-head{align-items:flex-start;flex-direction:column;gap:2px}.program{padding:0}.program-head,.item{padding:14px}.item{grid-template-columns:1fr;gap:10px}.action{justify-content:space-between}.stepper{flex:1;justify-content:space-between;max-width:188px}.done-btn{min-width:118px}.hero-row{align-items:flex-start}.hero-date{font-size:18px}}
</style>
</head>
<body>
<main class="prod-shell">
  <header class="prod-top">
    <div>
      <p class="prod-kicker">Elli Schloß Holte</p>
      <h1>Produktion</h1>
      <p class="prod-sub" id="statusText">Plan wird geladen …</p>
    </div>
    <nav class="prod-nav"><a class="link" href="/?view=plan">Dienstplan</a><a class="link" href="/kpi.html">KPIs</a></nav>
  </header>

  <section class="prod-card hero">
    <div class="hero-row">
      <div><div class="hero-date" id="dateHeadline">–</div><div class="hero-meta" id="generatedText"></div></div>
      <button id="todayBtn" class="secondary today-btn hidden" type="button">Heute</button>
    </div>
    <div class="chips" id="contextChips"></div>
  </section>

  <section class="prod-card overview">
    <div><small id="overviewLabel">Tagesmenge</small><strong id="overviewTotal">–</strong><small id="overviewSub">Stück gesamt</small></div>
    <div class="progress-wrap"><div class="progress-head"><span>Fortschritt</span><span id="progressText">0 / 0</span></div><div class="progress"><span id="progressBar" style="width:0%"></span></div></div>
  </section>

  <div class="sticky-controls">
    <div class="seg" id="typeTabs"><button data-type="Backplan" class="active">Backplan</button><button data-type="Brotplan">Brotplan</button><button data-type="Auftauplan">Auftauplan</button></div>
    <div class="seg" id="intervalTabs"><button data-i="0" class="active">Morgen</button><button data-i="1">Mittag</button><button data-i="2">Nachmittag</button></div>
  </div>

  <div class="interval-head"><h2 id="intervalHeadline">Morgen</h2><span class="interval-time" id="intervalTime">–</span></div>
  <div id="programs"><div class="prod-card empty">Plan wird geladen …</div></div>

  <details class="prod-card history-box" id="historyBox"><summary>Alte Pläne</summary><div class="history" id="history"><span class="prod-sub">Wird beim Öffnen geladen.</span></div></details>
</main>
<div class="toast" id="toast"></div>
<script>
"use strict";
const $=s=>document.querySelector(s);let current=null,currentType="Backplan",currentInterval=0,history=[],historyLoaded=false,todayIso="";
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function deDate(d){return d?new Intl.DateTimeFormat("de-DE",{weekday:"long",day:"2-digit",month:"2-digit",year:"numeric"}).format(new Date(d+"T12:00:00")):""}
function shortTime(v){return String(v||"").slice(0,5)}
function toast(text){let el=$("#toast");el.textContent=text;el.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove("show"),1600)}
async function api(u,o={}){let r=await fetch(u,{cache:"no-store",...o}),j=await r.json().catch(()=>({}));if(!r.ok){let e=new Error(j.error||"Daten konnten nicht geladen werden.");e.status=r.status;throw e}return j}
function isTodayPlan(){return current?.plan_date===todayIso}
function contextHtml(p){let c=p.context||{},w=p.weather||{},a=[];if(c.preview)a.push('<span class="chip preview">Vorschau</span>');if(c.isHoliday)a.push(`<span class="chip warn">Feiertag · ${esc(c.holiday)}</span>`);else if(c.dayBeforeHoliday)a.push('<span class="chip warn">Tag vor Feiertag</span>');else if(c.dayAfterHoliday)a.push('<span class="chip">Tag nach Feiertag</span>');if(!w.unavailable&&w.max!=null)a.push(`<span class="chip">${Math.round(w.max)}° · ${Number(w.rain||0).toFixed(0)} mm Regen</span>`);if(!a.length)a.push('<span class="chip good">Plan aktuell</span>');return a.join("")}
function actualMap(){return new Map((current?.actuals||[]).map(a=>[`${a.article_no}|${a.interval_index}`,a]))}
function selectCurrentInterval(){if(!current||!isTodayPlan())return 0;let now=new Date(),parts=new Intl.DateTimeFormat("en-GB",{timeZone:"Europe/Berlin",hour:"2-digit",minute:"2-digit",hourCycle:"h23"}).formatToParts(now),o=Object.fromEntries(parts.map(x=>[x.type,x.value])),m=+o.hour*60 + +o.minute,I=current.payload?.intervals||[];for(let i=0;i<I.length;i++){let [fh,fm]=(I[i].from||"00:00").split(":").map(Number),[th,tm]=(I[i].to||"23:59").split(":").map(Number);if(m>=fh*60+fm&&m<th*60+tm)return i}return m<(+(I[0]?.from||"05:30").split(":")[0])*60?0:Math.min(2,I.length-1)}
function completion(){let rows=(current?.payload?.items||[]).filter(x=>x.type===currentType&&(x.buckets?.[currentInterval]||0)>0),am=actualMap(),done=rows.filter(x=>am.has(`${x.no}|${currentInterval}`)).length;return{done,total:rows.length}}
function renderHistory(){$("#history").innerHTML=history.map(p=>`<button class="secondary ${current?.plan_date===p.plan_date?'active':''}" data-date="${p.plan_date}">${deDate(p.plan_date).replace(/,? \d{4}$/,'')}</button>`).join("")||'<span class="prod-sub">Noch keine älteren Pläne.</span>';document.querySelectorAll("#history button").forEach(b=>b.onclick=()=>loadPlan(b.dataset.date,true))}
function render(){if(!current)return;let p=current.payload||{},I=p.intervals||[],today=isTodayPlan(),it=I[currentInterval]||{name:["Morgen","Mittag","Nachmittag"][currentInterval],from:"",to:""};
  $("#dateHeadline").textContent=(today?"Heute · ":"")+deDate(current.plan_date);$("#generatedText").textContent=current.generated_at?`Plan erstellt ${new Intl.DateTimeFormat("de-DE",{dateStyle:"short",timeStyle:"short"}).format(new Date(current.generated_at))}`:"";$("#contextChips").innerHTML=contextHtml(current);$("#todayBtn").classList.toggle("hidden",today);
  document.querySelectorAll('#typeTabs button').forEach(b=>b.classList.toggle('active',b.dataset.type===currentType));document.querySelectorAll('#intervalTabs button').forEach((b,i)=>{b.classList.toggle('active',i===currentInterval);if(I[i])b.textContent=I[i].name});$("#intervalHeadline").textContent=it.name||["Morgen","Mittag","Nachmittag"][currentInterval];$("#intervalTime").textContent=it.from&&it.to?`${shortTime(it.from)}–${shortTime(it.to)} Uhr`:"";
  let allType=(p.items||[]).filter(x=>x.type===currentType),typeTotal=allType.reduce((s,x)=>s+(x.total||0),0),intervalTotal=allType.reduce((s,x)=>s+(x.buckets?.[currentInterval]||0),0),comp=completion();$("#overviewLabel").textContent=currentType;$("#overviewTotal").textContent=intervalTotal.toLocaleString("de-DE");$("#overviewSub").textContent=`Stück ${it.name||""} · ${typeTotal.toLocaleString("de-DE")} am Tag`;$("#progressText").textContent=`${comp.done} / ${comp.total}`;$("#progressBar").style.width=comp.total?`${Math.round(comp.done/comp.total*100)}%`:"0%";
  let am=actualMap(),rows=(p.items||[]).filter(x=>x.type===currentType&&(x.buckets?.[currentInterval]||0)>0).sort((a,b)=>{let ad=am.has(`${a.no}|${currentInterval}`),bd=am.has(`${b.no}|${currentInterval}`);return ad-bd||String(a.program).localeCompare(String(b.program),'de',{numeric:true})||a.name.localeCompare(b.name,'de')});let groups=new Map;for(let x of rows){if(!groups.has(x.program))groups.set(x.program,[]);groups.get(x.program).push(x)}let html='';
  for(let [program,items] of groups){let total=items.reduce((s,x)=>s+(x.buckets[currentInterval]||0),0),doneCount=items.filter(x=>am.has(`${x.no}|${currentInterval}`)).length;html+=`<section class="prod-card program ${today?'':'readonly'}"><div class="program-head"><div><div class="program-title">${currentType==='Auftauplan'?'Auftauen':'Programm '+esc(program)}</div><small>${doneCount}/${items.length} erledigt</small></div><div class="program-total">${total} Stk.</div></div>`;
    for(let x of items){let planned=x.buckets[currentInterval]||0,key=`${x.no}|${currentInterval}`,act=am.get(key),done=!!act,value=done?Number(act.actual_qty):planned,stamp=act?.done_at?new Intl.DateTimeFormat('de-DE',{hour:'2-digit',minute:'2-digit'}).format(new Date(act.done_at)):'';html+=`<div class="item ${done?'done':''}" data-row="${esc(x.no)}"><div><div class="item-name">${esc(x.name)}</div><div class="item-meta"><span class="planned-pill">Soll ${planned}</span>${x.total!==planned?`<span>Tag ${x.total}</span>`:''}${done&&stamp?`<span class="done-time">✓ ${stamp} Uhr</span>`:''}</div></div><div class="action"><div class="stepper"><button type="button" data-step="-1" data-no="${esc(x.no)}" aria-label="Menge verringern">−</button><input class="actual-input" inputmode="numeric" pattern="[0-9]*" min="0" step="1" value="${value}" data-input="${esc(x.no)}" aria-label="Ist-Menge"><button type="button" data-step="1" data-no="${esc(x.no)}" aria-label="Menge erhöhen">+</button></div><button class="done-btn ${done?'done':''}" data-done="${esc(x.no)}" data-planned="${planned}">${done?'✓ Gebacken':'Gebacken'}</button></div></div>`}
    html+='</section>'}
  $("#programs").innerHTML=html||'<div class="prod-card empty">Für dieses Intervall ist nichts geplant.</div>';$("#statusText").textContent=today?"Heutiger Produktionsplan":"Alter Produktionsplan · nur ansehen";
  document.querySelectorAll('[data-step]').forEach(btn=>btn.onclick=()=>{if(!today)return;let inp=document.querySelector(`[data-input="${CSS.escape(btn.dataset.no)}"]`),v=Math.max(0,Math.round(Number(inp.value||0)+Number(btn.dataset.step)));inp.value=v});document.querySelectorAll('[data-done]').forEach(btn=>btn.onclick=()=>saveDone(btn));if(historyLoaded)renderHistory()}
async function saveDone(btn){if(!isTodayPlan())return;let no=btn.dataset.done,input=document.querySelector(`[data-input="${CSS.escape(no)}"]`),actual=Math.max(0,Math.round(Number(input?.value||0))),planned=Number(btn.dataset.planned||0);btn.disabled=true;let old=btn.textContent;btn.textContent="Speichert …";try{await api('/api/bakery/actual',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({date:current.plan_date,articleNo:no,intervalIndex:currentInterval,plannedQty:planned,actualQty:actual})});let list=current.actuals||(current.actuals=[]),idx=list.findIndex(a=>String(a.article_no)===String(no)&&Number(a.interval_index)===currentInterval),rec={article_no:String(no),interval_index:currentInterval,planned_qty:planned,actual_qty:actual,done_at:new Date().toISOString()};if(idx>=0)list[idx]=rec;else list.push(rec);render();toast(actual===planned?"Als gebacken gespeichert":`Ist-Menge ${actual} gespeichert`)}catch(e){btn.textContent=old;toast(e.message)}finally{btn.disabled=false}}
async function loadPlan(d,manual=false){document.body.classList.add('loading');try{current=(await api(`/api/bakery/plan?date=${encodeURIComponent(d)}`)).plan;if(!manual)currentInterval=selectCurrentInterval();else currentInterval=0;render()}catch(e){if(e.status===401){location.href='/';return}$("#programs").innerHTML=`<div class="prod-card empty error">${esc(e.message)}</div>`}finally{document.body.classList.remove('loading')}}
async function loadHistory(){if(historyLoaded)return;$("#history").innerHTML='<span class="prod-sub">Alte Pläne werden geladen …</span>';try{history=(await api('/api/bakery/plans')).plans||[];historyLoaded=true;renderHistory()}catch(e){$("#history").innerHTML=`<span class="error">${esc(e.message)}</span>`}}
async function boot(){todayIso=new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Berlin',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());try{await api('/api/me/shifts');await loadPlan(todayIso)}catch(e){if(e.status===401){location.href='/';return}try{let x=await api('/api/bakery/plans');history=x.plans||[];historyLoaded=true;let best=history.find(p=>p.plan_date>todayIso)||history[0];if(best)await loadPlan(best.plan_date);else throw e}catch(err){$("#statusText").textContent='Noch kein Produktionsplan vorhanden.';$("#programs").innerHTML='<div class="prod-card empty">Der erste Plan wird automatisch erstellt, sobald Daten vorhanden sind.</div>'}}}
document.querySelectorAll('#typeTabs button').forEach(b=>b.onclick=()=>{currentType=b.dataset.type;render()});document.querySelectorAll('#intervalTabs button').forEach(b=>b.onclick=()=>{currentInterval=Number(b.dataset.i);render()});$("#todayBtn").onclick=()=>loadPlan(todayIso);$("#historyBox").addEventListener('toggle',()=>{if($("#historyBox").open)loadHistory()});boot();
</script>
</body>
</html>
